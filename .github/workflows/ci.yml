name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.12.6

      - name: Install Python dependencies
        run: uv sync --frozen --all-groups

      - name: Install Chromium for the SC-05 RPA contract
        run: uv run playwright install --with-deps --only-shell chromium

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build browser assets
        run: npm run build

      - name: Check worker entrypoint syntax
        run: sh -n scripts/run_worker_with_simulator.sh

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Check migrations
        run: uv run python src/manage.py makemigrations --check --dry-run

      - name: Check production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-validation-key-8rX3pQ7vN2mK5tW9cL4sH6jF1aD0zB7y
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: uv run python src/manage.py check --deploy --fail-level ERROR

      - name: Check private simulator settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.simulator
          DJANGO_SECRET_KEY: ci-only-validation-key-8rX3pQ7vN2mK5tW9cL4sH6jF1aD0zB7y
          DJANGO_ALLOWED_HOSTS: healthcheck.railway.app,simulator.railway.internal
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: uv run python src/manage.py check --deploy --fail-level ERROR

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  container:
    name: Container build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build --target runtime --tag sheepcontabil:${{ github.sha }} .
